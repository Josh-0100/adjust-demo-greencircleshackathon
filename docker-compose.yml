services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: sqlite:////app/data/civicforge.db
      BOLTON_DATABASE_PATH: /app/data/bolton_connect.db
      CHALLENGE_CONFIG_PATH: /app/config/challenge_config.yaml
      LLM_PROVIDER: deterministic
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8765:8000"
    volumes:
      - demo_data:/app/data
      - demo_config:/app/config
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
        ADJUST_FRONTEND_URL: http://adjust-frontend:3002
    depends_on:
      backend:
        condition: service_healthy
      adjust-frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  adjust-frontend:
    build:
      context: .
      dockerfile: modules/adjust/frontend/Dockerfile.integrated
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/modules/adjust').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  demo_data:
  demo_config:
